<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Lab</title>
    <link href="bootstrap/bootstrap.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container-fluid" style="border: 2px dashed red">
      <h1>Bootstrap Practice</h1>
      <section>
        <h3>Grid system</h3>
        <div class="row">
          <div class="col-sm-4 col-border text-primary">First Column</div>
          <div class="col-sm-2 col-border text-warning">Second Column</div>
          <div class="col-sm-6 col-border text-success">3rd Column</div>
        </div>
        <div class="row">
          <div class="col-md-4 col-border">1</div>
          <div class="col-md-4 col-border">1</div>
          <div class="col-md-4 col-border">1</div>
        </div>
        <div class="alert alert-warning alert-dismissible">
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
          ></button>
          <strong>Success!</strong> This alert box could indicate a successful
          or positive action.
        </div>
      </section>
      <section>
        <h3>Image Styles Practice</h3>
        <img src="images/riyadh.jpg" class="rounded d-block" width="40%" />
        <img src="images/riyadh.jpg" class="rounded-circle" width="40%" />
        <img src="images/riyadh.jpg" class="img-thumbnail" width="80%" />
      </section>
      <section>
        <h3>table practice</h3>
        <table class="table table-dark table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Name</th>
              <th>Department</th>
            </tr>
          </thead>
          <tbody>
            <tr class="table-danger">
              <td>1</td>
              <td>Abbas</td>
              <td>IS</td>
            </tr>
            <tr>
              <td>2</td>
              <td>Ali</td>
              <td class="table-success">CS</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Bader</td>
              <td>SE</td>
            </tr>
          </tbody>
        </table>
      </section>
      <div>
        <h2>Form validation example</h2>
        <form class="was-validated">
          <label for="userName" class="form-label">User Name</label>
          <input
            type="text"
            class="form-control"
            id="userName"
            placeholder="Enter user name"
            name="user_name"
            required
          />
          <div class="invalid-feedback">Please fill the user name.</div>
        </form>
      </div>
    </div>
    <script src="bootstrap/bootstrap.min.js"></script>
    <script>
      //   alert("Alert from the JavaScript code.");
    </script>
  </body>
</html>
