<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bootstrap/bootstrap.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container py-4">
      <!-- Navigation Buttons -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="btn-group w-100" role="group">
            <a href="index.html" class="btn btn-outline-primary">
              <i class="fas fa-list"></i> All Records
            </a>
            <a href="view-record.html" class="btn btn-outline-primary">
              <i class="fas fa-eye"></i> View/Edit Record
            </a>
            <a href="delete-record.html" class="btn btn-primary active">
              <i class="fas fa-trash-alt"></i> Delete Record
            </a>
            <a href="insert-record.html" class="btn btn-outline-primary">
              <i class="fas fa-plus-circle"></i> Insert Record
            </a>
          </div>
        </div>
      </div>

      <!-- Main Card -->
      <div class="card shadow">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0">
            <i class="fas fa-trash-alt"></i> Delete Student Record
          </h4>
        </div>
        <div class="card-body">
          <!-- ID Input Section -->
          <div class="row justify-content-center mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold"
                ><i class="fas fa-id-card"></i> Enter Student ID to
                Delete:</label
              >
              <div class="input-group">
                <input
                  type="number"
                  id="studentId"
                  class="form-control"
                  placeholder="Enter student ID (e.g., 1, 2, 3...)"
                  min="1"
                />
                <button class="btn btn-danger" onclick="loadStudent()">
                  <i class="fas fa-search"></i> Load Record
                </button>
              </div>
            </div>
          </div>

          <!-- Student Details Card (Hidden initially) -->
          <div id="studentDetails" style="display: none">
            <div class="alert alert-warning">
              <i class="fas fa-exclamation-triangle"></i>
              <strong>Warning:</strong> This action cannot be undone. Please
              confirm before deleting.
            </div>

            <div class="card border-danger">
              <div class="card-header bg-danger text-white">
                <h5 class="mb-0">
                  <i class="fas fa-user"></i> Student Details
                </h5>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="fw-bold">Student ID:</label>
                    <p id="displayId" class="form-control-plaintext"></p>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="fw-bold">Full Name:</label>
                    <p id="displayName" class="form-control-plaintext"></p>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="fw-bold">Gender:</label>
                    <p id="displayGender" class="form-control-plaintext"></p>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="fw-bold">Semester:</label>
                    <p id="displaySemester" class="form-control-plaintext"></p>
                  </div>
                  <div class="col-md-12 mb-3">
                    <label class="fw-bold">Major:</label>
                    <p id="displayMajor" class="form-control-plaintext"></p>
                  </div>
                </div>
              </div>
              <div class="card-footer">
                <button class="btn btn-danger" onclick="deleteStudent()">
                  <i class="fas fa-trash-alt"></i> Permanently Delete Record
                </button>
                <button class="btn btn-secondary" onclick="clearDetails()">
                  <i class="fas fa-times"></i> Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="text-center mt-4 text-muted">
        <p>
          <i class="fas fa-graduation-cap"></i> Student Management System | Full
          Stack Application
        </p>
      </footer>
    </div>
    <script>
      let currentStudent = null;
      function showAlert(message, type) {
        const alertDiv = document.createElement("div");
        alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
        alertDiv.style.zIndex = "9999";
        alertDiv.style.minWidth = "300px";
        alertDiv.innerHTML = `${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
        document.body.appendChild(alertDiv);
        setTimeout(() => alertDiv.remove(), 3000);
      }

      function showLoading(show) {
        let spinner = document.getElementById("loadingSpinner");
        if (show && !spinner) {
          spinner = document.createElement("div");
          spinner.id = "loadingSpinner";
          spinner.className =
            "position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center";
          spinner.style.backgroundColor = "rgba(0,0,0,0.5)";
          spinner.style.zIndex = "9998";
          spinner.innerHTML =
            '<div class="spinner-border text-light" role="status"><span class="visually-hidden">Loading...</span></div>';
          document.body.appendChild(spinner);
        } else if (!show && spinner) {
          spinner.remove();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");
        if (id) {
          document.getElementById("studentId").value = id;
          loadStudent();
        }
      });

      async function loadStudent() {
        const id = document.getElementById("studentId").value;
        if (!id) {
          showAlert("Please enter a student ID", "warning");
          return;
        }

        try {
          showLoading(true);
          const response = await fetch(`/data/student/${id}`);
          const result = await response.json();

          if (result.success) {
            if (result.data) {
              currentStudent = result.data;
              displayStudentDetails(result.data);
              showAlert(
                "Student record loaded. Please review before deleting.",
                "warning",
              );
            } else {
              showAlert("Student dose not exist.", "danger");
            }
          } else {
            throw new Error(result.message);
          }
          showLoading(false);
        } catch (error) {
          showLoading(false);
          showAlert("Error: " + error.message, "danger");
          clearDetails();
        }
      }

      function displayStudentDetails(student) {
        document.getElementById("displayId").innerHTML =
          `<strong>${student.id}</strong>`;
        document.getElementById("displayName").innerHTML = student.name;
        document.getElementById("displayGender").innerHTML =
          student.gender || "N/A";
        document.getElementById("displaySemester").innerHTML =
          `<span class="badge bg-secondary">Semester ${student.semester}</span>`;
        document.getElementById("displayMajor").innerHTML =
          `<span class="badge ${student.major === "CS" ? "bg-primary" : student.major === "IS" ? "bg-success" : "bg-danger"}">${student.major}</span>`;
        document.getElementById("studentDetails").style.display = "block";
      }

      async function deleteStudent() {
        if (!currentStudent) return;

        const confirmed = confirm(
          `Are you ABSOLUTELY sure you want to delete ${currentStudent.name} (ID: ${currentStudent.id})?\n\nThis action cannot be undone!`,
        );

        if (confirmed) {
          try {
            showLoading(true);
            const response = await fetch(`/data/student/${currentStudent.id}`, {
              method: "DELETE",
            });
            const result = await response.json();

            if (result.success) {
              showAlert(
                `Student ${currentStudent.name} (ID: ${currentStudent.id}) has been deleted successfully!`,
                "success",
              );
              clearDetails();
              setTimeout(() => {
                window.location.href = "index.html";
              }, 1000);
            } else {
              throw new Error(result.message);
            }
            showLoading(false);
          } catch (error) {
            showLoading(false);
            showAlert("Error deleting student: " + error.message, "danger");
          }
        }
      }

      function clearDetails() {
        document.getElementById("studentId").value = "";
        document.getElementById("studentDetails").style.display = "none";
        currentStudent = null;
      }
    </script>
    <script src="bootstrap/bootstrap.min.js"></script>
  </body>
</html>
