<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <!-- Navigation Buttons -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="btn-group w-100" role="group">
            <a href="index.html" class="btn btn-primary active">
              <i class="fas fa-list"></i> All Records
            </a>
            <a href="view-record.html" class="btn btn-outline-primary">
              <i class="fas fa-eye"></i> View/Edit Record
            </a>
            <a href="delete-record.html" class="btn btn-outline-primary">
              <i class="fas fa-trash-alt"></i> Delete Record
            </a>
            <a href="insert-record.html" class="btn btn-outline-primary">
              <i class="fas fa-plus-circle"></i> Insert Record
            </a>
          </div>
        </div>
      </div>

      <!-- Main Card -->
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">
            <i class="fas fa-users"></i> All Students Records
          </h4>
        </div>
        <div class="card-body">
          <!-- Search Box -->
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text"
                ><i class="fas fa-search"></i
              ></span>
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by name, major, or semester..."
              />
            </div>
          </div>

          <!-- Statistics Cards -->
          <div class="row mb-4">
            <div class="col-md-3 mb-2">
              <div class="card bg-primary text-white">
                <div class="card-body text-center">
                  <i class="fas fa-user-graduate fa-2x"></i>
                  <h3 class="mt-2" id="totalStudents">0</h3>
                  <p class="mb-0">Total Students</p>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card bg-info text-white">
                <div class="card-body text-center">
                  <i class="fas fa-code fa-2x"></i>
                  <h3 class="mt-2" id="totalCS">0</h3>
                  <p class="mb-0">CS Students</p>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card bg-success text-white">
                <div class="card-body text-center">
                  <i class="fas fa-database fa-2x"></i>
                  <h3 class="mt-2" id="totalIS">0</h3>
                  <p class="mb-0">IS Students</p>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card bg-danger text-white">
                <div class="card-body text-center">
                  <i class="fas fa-laptop-code fa-2x"></i>
                  <h3 class="mt-2" id="totalSE">0</h3>
                  <p class="mb-0">SE Students</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Students Table -->
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Gender</th>
                  <th>Semester</th>
                  <th>Major</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentTableBody">
                <tr>
                  <td colspan="6" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <footer class="text-center mt-4 text-muted">
        <p>
          <i class="fas fa-graduation-cap"></i> Student Management System | Full
          Stack Application
        </p>
      </footer>
    </div>
    <script>
      // Load all students on page load
      let allStudents = [];

      document.addEventListener("DOMContentLoaded", () => {
        loadStudents();
        document
          .getElementById("searchInput")
          .addEventListener("input", filterStudents);
      });

      async function loadStudents() {
        // // First Method: async and wait method to get the data from server
        // // sending HTTP GET request
        // const response = await fetch("/data/students");
        // // Reading the JSON respnse
        // const results = await response.json();

        // // if (results.length) {
        // //   let htmlString = "";
        // //   for (let i = 0; i < results.length; i++) {
        // //     htmlString += `
        // //     <tr>
        // //         <td>${results[i].id}</td>
        // //         <td>${results[i].name}</td>
        // //         <td>${results[i].gender}</td>
        // //         <td>${results[i].semester}</td>
        // //         <td>${results[i].major}</td>
        // //         <td>
        // //             <a href="view-record.html?id=${results[i].id}" class="btn btn-sm btn-warning">
        // //                 <i class="fas fa-edit"></i> Edit
        // //             </a>
        // //             <a href="delete-record.html?id=${results[i].id}" class="btn btn-sm btn-danger">
        // //                 <i class="fas fa-trash"></i> Delete
        // //             </a>
        // //         </td>
        // //     </tr>`;
        // //   }
        // //   document.getElementById("studentTableBody").innerHTML = htmlString;
        // //   updateStatistics(results);
        // // }
        // displayStudents(results);
        // updateStatistics(results);

        fetch("/data/students")
          .then((response) => response.json())
          .then((results) => {
            if (results.length) {
              allStudents = results;
              //   let htmlString = "";
              //   for (let i = 0; i < results.length; i++) {
              //     htmlString += `
              // <tr>
              //     <td>${results[i].id}</td>
              //     <td>${results[i].name}</td>
              //     <td>${results[i].gender}</td>
              //     <td>${results[i].semester}</td>
              //     <td>${results[i].major}</td>
              //     <td>
              //         <a href="view-record.html?id=${results[i].id}" class="btn btn-sm btn-warning">
              //             <i class="fas fa-edit"></i> Edit
              //         </a>
              //         <a href="delete-record.html?id=${results[i].id}" class="btn btn-sm btn-danger">
              //             <i class="fas fa-trash"></i> Delete
              //         </a>
              //     </td>
              // </tr>`;
              //   }
              //   document.getElementById("studentTableBody").innerHTML =
              //     htmlString;
              displayStudents(results);
              updateStatistics(results);
            }
          });
      }

      function updateStatistics(students) {
        document.getElementById("totalStudents").textContent = students.length;
        document.getElementById("totalCS").textContent = students.filter(
          (s) => s.major === "CS",
        ).length;
        document.getElementById("totalIS").textContent = students.filter(
          (s) => s.major === "IS",
        ).length;
        document.getElementById("totalSE").textContent = students.filter(
          (s) => s.major === "SE",
        ).length;
      }

      function filterStudents() {
        const searchTerm = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const filtered = allStudents.filter(
          (student) =>
            student.name.toLowerCase().includes(searchTerm) ||
            student.major.toLowerCase().includes(searchTerm) ||
            student.semester.toString().includes(searchTerm),
        );
        displayStudents(filtered);
      }

      function displayStudents(students) {
        const tableBody = document.getElementById("studentTableBody");
        tableBody.innerHTML = students
          .map(
            (student) => `
                <tr>
                    <td><strong>${student.id}</strong></td>
                    <td>${escapeHtml(student.name)}</td>
                    <td><span class="badge ${student.gender === "Male" ? "bg-info" : "bg-warning"}">${student.gender || "N/A"}</span></td>
                    <td><span class="badge bg-secondary">Semester ${student.semester}</span></td>
                    <td><span class="badge ${student.major === "CS" ? "bg-primary" : student.major === "IS" ? "bg-success" : "bg-danger"}">${student.major}</span></td>
                    <td>
                        <a href="view-record.html?id=${student.id}" class="btn btn-sm btn-warning">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <a href="delete-record.html?id=${student.id}" class="btn btn-sm btn-danger">
                            <i class="fas fa-trash"></i> Delete
                        </a>
                    </td>
                </tr>
            `,
          )
          .join("");
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
    <script src="bootstrap/bootstrap.min.js"></script>
  </body>
</html>
